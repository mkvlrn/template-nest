[tools]
biome = "2.5.12"
cocogitto = "7.0.0"
lefthook = "2.1.12"
node = "26.8.1"
pnpm = "12.3.4"

[hooks]
postinstall = "lefthook install"

[env]
_.path = ["./node_modules/.bin"]

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[tasks.dev]
description = "Dev mode"
run = "node --import=tsx --watch src/main.ts"
[tasks.lint]
description = "Check files with biome"
run = "biome check --diagnostic-level=warn --no-errors-on-unmatched"
[tasks.lint-fix]
description = "Fix files with biome"
run = "biome check --diagnostic-level=warn --no-errors-on-unmatched --write"
[tasks.typecheck]
description = "Run tsc"
run = "tsc"
[tasks.test]
description = "Run vitest"
run = "vitest --coverage"
[tasks.test-staged]
description = "Run vitest on staged files"
run = "vitest related --bail=1 --reporter=github-actions"
[tasks.test-ci]
description = "Run vitest in ci mode"
run = "vitest --bail=1 --reporter=github-actions"
[tasks.sync-branch]
description = "Sync package manager deps"
run = "mise install && mise prune -y && pnpm install --frozen-lockfile && lefthook install"
