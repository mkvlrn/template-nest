name: checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5

      - run: pnpm install
      - run: mise run typecheck
      - run: mise run lint
      - run: mise run test-ci
